<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Banking UI</title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="banking-container">
    <h1 id="balance-display">Balance: $0.00</h1>

    <form id="banking-form">
      <input
        type="number"
        id="amount"
        class="input-field"
        placeholder="Enter amount"
        step="0.01"
      />

      <div class="actions">
        <button type="button" class="btn btn-deposit" id="deposit-btn">
          Deposit
        </button>

        <button type="button" class="btn btn-withdrawal" id="withdraw-btn">
          Withdraw
        </button>
      </div>

      <p id="error-message" class="error-message"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
